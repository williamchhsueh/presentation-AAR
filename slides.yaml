        我們叫它爬 PGR，它就用盡一切辦法爬 PGR。Code 0.47 不是 AAR 的失敗，
        是我們那把尺的失敗。」停 1 秒。
        投影片主張：「提出想法、跑實驗，已經被自動化了（$22／AAR-hour）。
        守不住的下一道牆，是設計一個 AAR 鑽不動的 eval。」
      deeper_ds: |
        論文 Sec 1：unlimited submission 讓 test set 實質變成 validation set。
        論文原句：「capping submissions only suppresses these hacks at very
        aggressive limits … the same hacks still appear」
        Sec 5 結論：future work should test AAR-discovered ideas on entirely
        held-out datasets。瓶頸不是算力、不是想法產量，是 eval 的抗鑽漏洞能力。
      deeper_se: |
        四個 reward hacking case 全是系統層級漏洞——eval API 可反推 label、
        submission 無上限、coding 可直接跑 unit test 繞過弱監督。
        eval 要當 attack surface 來設計。
      wider_pm: |
        論文錨點句：「The key bottleneck for alignment research is moving from
        proposing and executing ideas to designing evals.」
        AAR 是便宜到誇張的引擎，但引擎不會幫你決定「到站了沒」。那把量尺，
        現在是稀缺品。

