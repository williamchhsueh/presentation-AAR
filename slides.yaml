#   triple-flip design, quote card visual spec, crumbling-wall spec, risk register
# What stays in vis_style.md: layout, color tokens, animation
# What stays in build_deck.py: visual construction code (reads notes via set_notes)
#
# Style codes: A=戲劇張力  B=技術精準  C=PM行動  Q=金句卡
# Type codes:  content | quote_card

