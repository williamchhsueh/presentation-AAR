  # ── ACT II: 女王的觸碰 (05–08) ────────────────────────────────────────

  - id: 5
    act: 2
    act_name: 女王的觸碰
    type: content
    style: B
    dark_bg: false
    pause_sec: 2
    title: "Superalignment 背景 + W2SG 原理（合併）"
    aot_scene: 女王的觸碰
    emotion: 建立技術前提
    figures: []
    aot_asset: null  # 需要：Historia 握住艾連的手的瞬間
    aot_asset_placement: 右側，半身入鏡
    v2_note: "合併 v1 Slide 04+05；W2SG 類比強制換成女王的觸碰"
    notes:
      core: |
        口語開場（30 秒，A 戲劇張力）：
        「在《進擊的巨人》最震撼的一幕裡，一切發生在一個觸碰之間。Historia 不是世界上最強、
        甚至不是最聰明的，但她有王家血脈——一個合法的觸發信號。而艾連的能力從來不需要被賦予，
        他只需要一個接點，就能從內部炸開。這一幕，就是 W2S 論文的靈魂。」
        停 2 秒，再開始講右側機制圖。
      deeper_ds: |
        W2SG = Weak-to-Strong Generalization。
        女王（Historia）= 有合法性但能力受限的弱模型；
        觸碰 = 用有噪聲的標籤做 fine-tuning；
        始祖覺醒 = 強模型被引導至接近能力天花板。
        關鍵：fine-tuning 是「方向選擇器」而非「知識注入器」——記憶繼承（預訓練）才是觸碰生效的原因。
        標籤品質不需要 95%+ 才有效，pipeline 設計可接受噪聲。
      deeper_se: |
        弱監督者是可替換的觸發層，強模型能力上限由 pretraining distribution 決定，
        不由監督者決定。標籤品質不需要達到 95%+ 才能有效訓練。
      wider_pm: |
        你不需要比 GPT-5 更強的審核者，才能讓 GPT-5 做對事情。
        監督者的瓶頸，不再是能力，而是方向性。
        「當你在訓練一個比你強的模型，你的角色不是老師——你是那個觸點。」

  - id: 6
    act: 2
    act_name: 女王的觸碰
    type: content
    style: B
    dark_bg: false
    pause_sec: 2
    title: "Outcome-Gradable：能被量測才能被研究"
    aot_scene: null
    emotion: 顯性化前提
    figures: []
    aot_asset: null
    v2_note: "新頁，v1 完全沒有，現獨立一頁"
    notes:
      core: |
        AAR 能運作，有一個關鍵前提——問題必須是 outcome-gradable（有客觀量測指標）。
        W2SG 是少數滿足這個條件的對齊問題之一。
      deeper_ds: |
        論文原句：「The key bottleneck for alignment research is moving from proposing
        and executing ideas to designing evals.」
        未來的研究挑戰是把更多對齊問題「轉譯」成 outcome-gradable 形式。
      wider_pm: |
        AAR 是強大的引擎，但你得先把跑道鋪好。跑道 = 可量測的成敗指標。
        沒有跑道，引擎再強也飛不起來。
      wider_se: |
        對應軟體工程的「可測試性」——能不能寫單元測試，決定了能不能用 AAR 加速這塊。

