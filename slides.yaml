        caption: "Figure 5 — Directed vs Undirected PGR 比較"
    aot_asset: null  # 需要：超長距離索敵陣形俯視圖
    aot_asset_placement: 右半區，搭配箭頭
    v2_note: "fig07 升格為主圖，fig05 降為佐證；entropy collapse 變成主論點"
    notes:
      core: |
        「調查兵團的陣形把偵察單位分散到彼此不可見的距離——任何一個遭遇巨人都不影響
        其他人繼續探索。9 個 AAR 從不同方向出發，原理完全一樣：防止研究方向因一個
