        講完直接切 Slide 08 金句卡，不做口頭過渡。
      deeper_ds: |
        技術層次：AAR = Claude 模型 + scaffolding + 評分 API + sandbox 執行環境的組合系統。
      deeper_se: |
        架構要解決三件事：任務分派（Dashboard）、隔離執行（多個 sandbox）、結果聚合（Forum）。

