        論文錨點句：「Today's alignment progress is bottlenecked by human researchers.」
        翻譯字幕同步：「我們的監督能力，正在輸給模型能力的增長尺寸。」
        停 2 秒，直接切 Slide 04 金句卡，不做口頭過渡。
      deeper_ds: |
        RLHF、Constitutional AI 等方法就是「牆」，用人類的標註與判斷能力砌成。
        超大型巨人不是打倒守衛，是直接讓牆在結構上失效——牆從來不是為這個尺寸的威脅而建。
